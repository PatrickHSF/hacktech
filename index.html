<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Avalia-Me</title>

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<!-- CSS -->
<link rel="stylesheet" href="estilo.css">

</head>

<body class="body-login">

<!-- =========================
     LOGIN
========================= -->

<div class="container-login">

    <!-- LOGO -->
    <div class="text-center">

        <img src="logo.png"
        class="logo-login">

    </div>

    <!-- TITULO -->
    <div class="titulo-login">

        Bem-vindo 👋

    </div>

    <div class="subtitulo-login">

        Entre para contratar e avaliar prestadores de serviço

    </div>

    <!-- FORM -->
    <form class="mt-4">

        <!-- EMAIL -->
        <div class="campo-login">

            <i class="bi bi-envelope"></i>

            <input type="email"
            placeholder="Digite seu e-mail">

        </div>

        <!-- SENHA -->
        <div class="campo-login mt-3">

            <i class="bi bi-lock"></i>

            <input type="password"
            placeholder="Digite sua senha">

        </div>

        <!-- ESQUECI -->
        <div class="text-end mt-3">

            <a href="#"
            class="link-login">

                Esqueci minha senha

            </a>

        </div>

        <!-- BOTÃO -->
        <a href="home.html"
        class="btn-entrar-login text-decoration-none">

            <i class="bi bi-box-arrow-in-right"></i>

            Entrar

        </a>

    </form>

    <!-- DIVISÃO -->
    <div class="divisao-login">

        <span>ou continue com</span>

    </div>

    <!-- REDES -->
    <div class="d-flex gap-3 mt-4">

        <button class="btn-social-login">

            <i class="bi bi-google"></i>

        </button>

        <button class="btn-social-login">

            <i class="bi bi-facebook"></i>

        </button>

        <button class="btn-social-login">

            <i class="bi bi-apple"></i>

        </button>

    </div>

    <!-- CADASTRO -->
    <div class="texto-cadastro">

        Não possui conta?

        <a href="#"
        class="link-cadastro">

            Criar conta

        </a>

    </div>

</div>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
